<li>
  <a class="card-post" href="{{ include.post.url | relative_url }}">
    <div class="card-capa">
      {%- if include.post.image -%}
      <img src="{{ include.post.image | relative_url }}" alt="" loading="lazy">
      {%- else -%}
      <img class="sem-capa" src="{{ '/assets/img/pulo2.webp' | relative_url }}" alt="" loading="lazy">
      {%- endif -%}
    </div>
    <div class="card-corpo">
      <span class="card-data">{% include data-pt.html date=include.post.date %}</span>
      <h3>{{ include.post.title }}</h3>
      {%- if include.post.description %}<p>{{ include.post.description }}</p>{% endif %}
    </div>
  </a>
</li>
